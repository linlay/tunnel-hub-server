name: tunnel-hub

services:
  server:
    image: tunnel-hub-server
    container_name: tunnel-hub-server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_MODULE_PATH: "${GO_MODULE_PATH:?GO_MODULE_PATH is required}"
    env_file:
      - .env
    environment:
      RELAY_ADDR: ":8080"
      SSO_JWT_PUBLIC_KEY_FILE: "/configs/jwt-public.pem"
      CONVERSATION_SHARE_RESOURCE_DIR: "/data/conversation-shares"
    ports:
      - "127.0.0.1:${TUNNEL_HUB_RELAY_PORT:-11961}:8080"
    volumes:
      - ./configs/jwt-public.pem:/configs/jwt-public.pem:ro
      - conversation-share-data:/data/conversation-shares

  public:
    image: tunnel-hub-public
    container_name: tunnel-hub-public
    build:
      context: .
      dockerfile: tunnel-hub-public/Dockerfile
    environment:
      PUBLIC_SITE_TITLE: "${PUBLIC_SITE_TITLE:?PUBLIC_SITE_TITLE is required}"
    ports:
      - "127.0.0.1:${TUNNEL_HUB_PUBLIC_PORT:-11965}:80"
    restart: unless-stopped

volumes:
  conversation-share-data:
