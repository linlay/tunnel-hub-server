name: tunnel-hub-public

services:
  public:
    image: tunnel-hub-public
    container_name: tunnel-hub-public
    build:
      context: ..
      dockerfile: tunnel-hub-public/Dockerfile
      args:
        BRAND_CONFIG_FILE: "${BRAND_CONFIG_FILE:-configs/brand.yaml}"
    ports:
      - "127.0.0.1:${PUBLIC_HTTP_PORT:-11965}:80"
